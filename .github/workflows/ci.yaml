name: StatusPage CI

on:
	push:
	 branches: [main, develop]
	pull_request:
	 branches: [main, develop]
jobs:
	validate-and-build:
	 runs-on: ubuntu-latest
	 steps:
	  - name: Récupérer le code
	  uses: actions/checkout@v4

	  - name: Valider les fichiers
	  run: ./tests/validate.sh
	  - name: Construire l'image Docker
 	  run: docker build -t statuspage:${{ github.sha }} .

	  - name: Tester le conteneur
	  run: |
	   docker run -d --name statuspage-ci \
	    -p 8080:8080 statuspage:${{ github.sha }}
	   sleep 3
	   curl --fail http://localhost:8080/healthz
	   docker rm -f statuspage-ci
